services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: branchbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8081:8081"

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata:
